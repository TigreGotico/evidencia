[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "evidencia"
dynamic = ["version"]
description = "Decision gates for retrieval-augmented generation: passage selection, evidence sufficiency and answer grounding, with calibrated probabilities."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "evidencia/_vendor/kev/LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "TigreGotico" }]
keywords = ["rag", "retrieval", "grounding", "abstention", "decision-model", "fastapi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Framework :: FastAPI",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "ovos-plugin-manager>=3.1.0a1",
    "numpy>=1.26",
    "ovos-solver-bm25-plugin>=0.1.3a1",
    "ovos-document-chunkers>=0.1.3a1",
    "requests>=2.31",
    "unblock_requests[stealth]>=0.3.2a1",
    "pydantic>=2.9",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# run a Kev-family decision model in the same process
local = [
    "torch>=2.6",
    "transformers>=5.17",
    "peft>=0.21",
    "huggingface_hub>=0.30",
    "safetensors>=0.4",
]
# hybrid retrieval: BM25 fused with static embeddings
hybrid = [
    "model2vec>=0.6",
]
# let an agent use a running service through the Model Context Protocol
mcp = [
    "mcp>=2.3",
]
# answer generators
generators = [
    "ovos-openai-plugin>=2.0.14a1",
    "ovos-gguf-plugin>=1.2.6a1",
]
test = [
    "pytest>=8",
    "httpx>=0.27",
    "mcp>=2.3",
]

[project.urls]
Homepage = "https://github.com/TigreGotico/evidencia"
Repository = "https://github.com/TigreGotico/evidencia"
Issues = "https://github.com/TigreGotico/evidencia/issues"

[project.scripts]
evidencia = "evidencia.__main__:main"

[tool.setuptools.packages.find]
include = ["evidencia*"]

[tool.setuptools.package-data]
evidencia = ["locale/*.json", "web/*.html", "_vendor/kev/LICENSE"]

[tool.setuptools.dynamic]
version = { attr = "evidencia.version.__version__" }

[tool.pytest.ini_options]
testpaths = ["test"]
