# Copy to evidencia.toml. docs/configuration.md describes every key.
# Settings without a [section] must come before the first [section] line.

# the chat model that writes answers: AMALIA-9B, served by the "amalia" service in compose.yml
generator = "amalia"

# keep collections when the service restarts
data_dir = "/collections"

# public Portuguese sources that a question can name; docs/sources.md gives their licences
sources = ["pt.wikipedia", "wikidata", "dicionario-aberto"]

# hybrid retrieval: BM25 and embeddings together; the image installs the hybrid extra
embedding_model = "minishlab/potion-multilingual-128M"

[generator_config]
api_url = "http://amalia:8000/v1"

[decision]
backend = "local"
run = "TigreGotico/jevasio-0.8b-v2"
device = "cpu"
